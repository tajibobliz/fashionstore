def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
if (project.extensions.findByName('kotlin') == null) apply plugin: "org.jetbrains.kotlin.android"
apply from: '../nitrogen/generated/android/VisionCameraPoseLandmarker+autolinking.gradle'
apply from: './fix-prefab.gradle'

android {
  namespace "com.margelo.nitro.camera.poselandmarker"
  ndkVersion rootProject.ext.ndkVersion
  compileSdkVersion rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild { cmake { path "CMakeLists.txt" } }
  packagingOptions {
    excludes = ["META-INF", "META-INF/**", "**/libc++_shared.so", "**/libNitroModules.so", "**/libfbjni.so", "**/libjsi.so", "**/libreactnative.so"]
  }
  buildFeatures { buildConfig true; prefab true }
  compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

repositories { google(); mavenCentral() }

dependencies {
  compileOnly "com.facebook.react:react-android"
  implementation "androidx.annotation:annotation:1.9.1"
  implementation "androidx.camera:camera-core:1.7.0-alpha03"
  implementation "com.google.mediapipe:tasks-vision:0.10.32"
  compileOnly project(":react-native-nitro-modules")
  compileOnly project(":react-native-vision-camera")
}
